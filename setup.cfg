[pycodestyle]
# Maximum allowed line length
max-line-length = 120

# List of error codes to ignore
ignore = 
    E123,
    E203,
    E265,
    E302,
    E402,
    E501,
    E722,
    W291,
    W292,
    W293,
    W503,
    W504

# Exclude directories from checking
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    .pytest_cache,
    htmlcov,
    docs,
    node_modules

# Indentation size
indent-size = 4

# Show source code for each error
show-source = True

# Show pep8 statistics for each file
statistics = True

[flake8]
# Maximum allowed line length
max-line-length = 120

# List of error codes to ignore
ignore = E123, E203, E265, E302, E402, E501, E722, W291, W292, W293, W503, W504

# Exclude directories
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    .pytest_cache,
    htmlcov,
    docs

# Maximum complexity allowed
max-complexity = 10
