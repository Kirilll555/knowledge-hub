<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Задать вопрос</title>
    {% include 'base_styles.html' %}
</head>
<body>
    {% include 'menu.html' %}

    <div class="ask-container">
        <div class="ask-header">
            <h1>📝 Задать новый вопрос</h1>
        </div>

        <div class="ask-form">
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Заголовок</label>
                    <input type="text" name="title" class="form-input" placeholder="Кратко опишите суть вопроса" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-textarea" placeholder="Опишите ваш вопрос." required></textarea>
                </div>



                <button type="submit" class="submit-btn">📤 Опубликовать вопрос</button>
            </form>
        </div>
    </div>
</body>
</html>
