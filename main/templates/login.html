{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
    <h1>Вход</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <p>
            <label>Email или никнейм:</label><br>
            <input type="text" name="username" size="30" required>
        </p>
        
        <p>
            <label>Пароль:</label><br>
            <input type="password" name="password" size="30" required>
        </p>
        
        <p>
            <button type="submit">Войти</button>
        </p>
    </form>

    <hr>

    <h2>Регистрация</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <p>
            <label>Имя и фамилия:</label><br>
            <input type="text" name="fullname" size="30" required>
        </p>
        
        <p>
            <label>Email:</label><br>
            <input type="email" name="email" size="30" required>
        </p>
        
        <p>
            <label>Никнейм:</label><br>
            <input type="text" name="username" size="30" required>
        </p>
        
        <p>
            <label>Пароль:</label><br>
            <input type="password" name="password" size="30" required>
        </p>
        
        <p>
            <label>Подтверждение пароля:</label><br>
            <input type="password" name="password2" size="30" required>
        </p>
        
        <p>
            <button type="submit">Зарегистрироваться</button>
        </p>
    </form>
{% endblock %}
