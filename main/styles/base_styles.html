<style>
:root {
    --accent: #F2DAAC;
    --accent-dark: #e5c98d;
    --radius-xl: 16px;
    --radius-lg: 12px;
    --radius-md: 8px;
    --bg-main: #d1d5db;
    --card-bg: #ffffff;
    --item-bg: #f3f4f6;
    --item-hover: #ffffff;
    --text-main: #111827;
    --text-sub: #4b5563;
    --border: rgba(0, 0, 0, 0.15);
    --btn-bg: #ffffff;
    --shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
}

body.dark-theme {
    --bg-main: #000000;
    --card-bg: #1a1a1a;
    --btn-bg: #1a1a1a;
    --item-bg: rgba(0, 0, 0, 0.3);
    --item-hover: rgba(242, 218, 172, 0.08);
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --border: rgba(242, 218, 172, 0.3);
    --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

html { scrollbar-gutter: stable; }

body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
}

body.dark-theme {
    background-image: none !important;
    background-color: #000000 !important;
}

*::-webkit-scrollbar { width: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--accent-dark); border-radius: 10px; }

.navbar {
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    padding: 1rem 0;
    box-shadow: 0 6px 40px rgba(0, 0, 0, 0.3);
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid var(--border);
    width: 100%;
}

.nav-container {
    width: 100%;
    max-width: 1700px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
}

.site-title {
    color: var(--text-main);
    text-decoration: none;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    white-space: nowrap;
    text-shadow: 0 4px 12px rgba(0,0,0,0.4);
}

.search-container {
    display: flex;
    align-items: center;
    width: 320px;
}

.search-input {
    width: 100%;
    padding: 10px 18px;
    border: 1px solid var(--border);
    border-radius: 30px 0 0 30px;
    font-size: 1rem;
    outline: none;
    background: var(--item-bg);
    color: var(--text-main);
    backdrop-filter: blur(5px);
}

.search-input::placeholder {
    color: var(--text-sub);
}

.search-input:focus {
    border-color: var(--accent);
    background: var(--item-hover);
}

.search-btn {
    background: var(--btn-bg);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 0 30px 30px 0;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    display: inline-block;
    line-height: 1;
    transition: all 0.2s;
    backdrop-filter: blur(5px);
}

.search-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.nav-links {
    display: flex;
    gap: 8px;
    list-style: none;
    align-items: center;
    margin: 0;
    padding: 0;
}

.nav-links a {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.4rem 0.9rem;
    border-radius: 40px;
    white-space: nowrap;
    background: var(--item-bg);
    border: 1px solid var(--border);
}

.nav-links a:hover {
    background: var(--accent);
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.nav-links a.active {
    background: var(--accent);
    color: #000;
    font-weight: 600;
    border-color: var(--accent);
}

.theme-btn-nav {
    color: var(--text-main);
    background: var(--item-bg);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 0.4rem 0.9rem;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    min-width: 42px;
    height: 38px;
    margin-left: 5px;
}

.theme-btn-nav:hover {
    background: var(--accent);
    border-color: var(--accent);
    transform: translateY(-2px);
    color: #000;
}

@media (max-width: 768px) {
    .nav-container {
        flex-direction: column;
        gap: 10px;
        padding: 10px;
    }

    .nav-right {
        width: 100%;
        justify-content: center;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
    }
    .search-container {
        width: 100%;
    }
}

@media (max-width: 480px) {
    .nav-links a {
        padding: 0.3rem 0.7rem;
        font-size: 0.8rem;
    }
    .theme-btn-nav {
        padding: 0.3rem 0.7rem;
        font-size: 1rem;
        min-width: 36px;
        height: 34px;
    }
    .site-title {
        font-size: 1.4rem;
    }
}
</style>
