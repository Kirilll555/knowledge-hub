<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f5f7fa;
        display: flex;
        flex-direction: column;
    }

    .navbar {
        background-color: white;
        padding: 1rem 0;
        box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid #eef2f6;
        width: 100%;
    }

    .nav-container {
        width: 100%;
        padding: 0 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .site-title {
        color: #1a1e2b;
        text-decoration: none;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: -0.3px;
        background: linear-gradient(135deg, #0066cc, #0052a3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        white-space: nowrap;
    }

    .search-container {
        display: flex;
        align-items: center;
        width: 300px;
    }

    .search-input {
        width: 100%;
        padding: 8px 15px;
        border: 1px solid #e0e7ed;
        border-radius: 20px 0 0 20px;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
    }

    .search-input:focus {
        border-color: #0066cc;
    }

    .search-btn {
        background: #0066cc;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 0 20px 20px 0;
        cursor: pointer;
        font-size: 1rem;
        text-decoration: none;
        display: inline-block;
        line-height: 1;
        transition: background-color 0.2s;
    }

    .search-btn:hover {
        background: #0052a3;
    }

    .nav-right {
        display: flex;
        align-items: center;
    }

    .nav-links {
        display: flex;
        gap: 20px;
        list-style: none;
        align-items: center;
        flex-wrap: wrap;
    }

    .nav-links a {
        color: #4a5568;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        padding: 0.6rem 1rem;
        border-radius: 30px;
        transition: all 0.2s;
        white-space: nowrap;
    }

    .nav-links a:hover {
        background-color: #f0f7ff;
        color: #0066cc;
    }

    .nav-links a.active {
        background-color: #e6f0ff;
        color: #0066cc;
        font-weight: 600;
    }

    .main-content {
        display: flex;
        gap: 40px;
        margin: 40px 5%;
        flex: 1;
        min-height: 0;
    }

    .left-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        gap: 30px;
        min-height: 0;
    }

    .right-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-width: 1500px;
        width: 500px;
    }

    .hero-section {
        text-align: left;
    }

    .hero-section h1 {
        font-size: 2.5rem;
        color: #1a1e2b;
        margin-bottom: 15px;
    }

    .hero-section p {
        font-size: 1.2rem;
        color: #4a5568;
        line-height: 1.6;
    }

        flex-direction: column;
        gap: 25px;
        max-width: 600px;
    }

    .action-btn {
        color: white;
        text-decoration: none;
        padding: 28px 60px;
        border-radius: 70px;
        font-size: 1.9rem;
        font-weight: 600;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        justify-content: center;
        letter-spacing: 0.5px;
    }

    .ask-btn {
        background: #0066cc;
    }

    .ask-btn:hover {
        background: #0052a3;
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(0,102,204,0.3);
    }

    .ai-btn {
        background: #6c5ce7;
    }

    .ai-btn:hover {
        background: #5b4bc4;
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(108,92,231,0.3);
    }

        flex-direction: column;

        min-height: 0;

        font-size: 1.5rem;
        margin-bottom: 20px;

    .questions-list, .answers-list {
        flex: 1;
        min-height: 0;
    }

    .question-placeholder, .answer-placeholder {
        color: #8895aa;
        text-align: center;
        padding: 40px;
        background-color: #f8fafd;
        border-radius: 10px;
        border: 2px dashed #d0e0ff;
        font-size: 1.1rem;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .profile-content, .settings-content, .questions-content, .ask-content, .comments-content {
        margin: 40px 5%;
        padding: 30px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.03);
        border: 1px solid #eef2f6;
    }

    .profile-content h1, .settings-content h1, .questions-content h1, .ask-content h1, .comments-content h1 {
        color: #1a1e2b;
        margin-bottom: 20px;
    }

    @media (max-width: 768px) {
        .main-content {
            flex-direction: column;
        }

        .right-column {
            max-width: 100%;
        }

        .nav-container {
            flex-direction: column;
            gap: 15px;
        }

        .nav-links {
            justify-content: center;
        }

        .search-container {
            width: 100%;
            max-width: 100%;
            margin: 10px 0;
        }

        .hero-section h1 {
            font-size: 2rem;
        }

        .hero-section p {
            font-size: 1rem;
        }

        .action-buttons {
            max-width: 100%;
        }

        .action-btn {
            padding: 22px 45px;
            font-size: 1.6rem;
        }
    }

    @media (max-width: 480px) {
        .nav-links {
            flex-direction: column;
            width: 100%;
        }

        .nav-links a {
            width: 100%;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 1.5rem;
        }

        .action-btn {
            padding: 18px 35px;
            font-size: 1.4rem;
        }

        .recent-questions h2, .recent-answers h2 {
            font-size: 1.3rem;
        }

        .question-placeholder, .answer-placeholder {
            padding: 30px;
            font-size: 1rem;
        }
