<style>
.ai-container {

    margin: 2rem auto;

}

}

}

}

.chat-header h2 {
    font-size: 1.5rem;

    color: var(--text-main);

}

    max-height: 500px;
    overflow-y: auto;

    flex-direction: column;
    gap: 1rem;
}

.message {
    display: flex;

}

.bot-message {

}

    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
}

.message-bubble {

    font-size: 0.95rem;
    line-height: 1.5;

}

.user-message .message-bubble {
    background: var(--accent);

}

.placeholder {

    opacity: 0.7;
}

.error-message {
