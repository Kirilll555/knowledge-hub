<nav class="navbar">
    <div class="nav-container">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/" class="site-title" id="site-title">🎓 Knowledge Hub</a>

            <div class="search-container">
                <input type="text" class="search-input" placeholder="Задать вопрос...">
                <a href="/ask_ai/" class="search-btn">📝</a>
            </div>
        </div>

        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="/">Главная</a></li>
                <li><a href="/settings/">Настройки</a></li>
            </ul>
            <button class="theme-btn-nav" id="themeToggle">🌙</button>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn) themeBtn.textContent = '☀️';
        }

        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-theme');
                if (document.body.classList.contains('dark-theme')) {
                    localStorage.setItem('theme', 'dark');
                    themeToggle.textContent = '☀️';
                } else {
                    localStorage.setItem('theme', 'light');
                    themeToggle.textContent = '🌙';
                }
            });
        }

        const siteTitle = document.getElementById('site-title');
        siteTitle.addEventListener('click', function(event) {
            event.preventDefault();
            window.location.href = '/';
        });

        const navLinks = document.querySelectorAll('.nav-links a');
        const currentPath = window.location.pathname;

        navLinks.forEach(function(link) {
            const href = link.getAttribute('href');
            if (href === currentPath) {
                link.classList.add('active');
            }
        });

        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-btn');

        if (searchBtn) {
            searchBtn.addEventListener('click', function(event) {
                event.preventDefault();
                window.location.href = '/ask_ai/';
            });
        }

        if (searchInput) {
            searchInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    window.location.href = '/ask_ai/';
                }
            });
        }
    });
</script>
