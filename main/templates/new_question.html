{% extends "base.html" %}

{% block title %}Новый вопрос{% endblock %}

{% block content %}
    <h1>Задать новый вопрос</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <p>
            <label>Заголовок:</label><br>
            <input type="text" name="title" size="80" required>
        </p>
        
        <p>
            <label>Описание:</label><br>
            <textarea name="description" rows="10" cols="80" required></textarea>
        </p>
        
        <p>
            <label>Теги (через запятую):</label><br>
            <input type="text" name="tags" size="80">
        </p>
        
        <p>
            <button type="submit">Опубликовать</button>
        </p>
    </form>
    
    <p>
        <a href="{% url 'index' %}">← На главную</a>
    </p>
{% endblock %}
