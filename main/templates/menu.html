<nav class="navbar">
    <div class="nav-container">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="#" class="site-title" id="site-title">🎓 Knowledge Hub</a>

            <div class="search-container">
                <input type="text" class="search-input" placeholder="Поиск вопросов...">
                <a href="/questions/" class="search-btn">🔍</a>
            </div>
        </div>

        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="#">Главная</a></li>
                <li><a href="#">Настройки</a></li>
            </ul>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const siteTitle = document.getElementById('site-title');
        siteTitle.addEventListener('click', function(event) {
            event.preventDefault();
            window.location.href = '/';
        });

        const navLinks = document.querySelectorAll('.nav-links a');
        navLinks.forEach(function(link) {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                const text = this.textContent.trim();
                let url = '';
                if (text === 'Главная') url = '/';
                if (text === 'Настройки') url = '/settings/';
                if (url) {
                    window.location.href = url;
                }
            });
        });

        const currentPath = window.location.pathname;
        navLinks.forEach(function(link) {
            const text = link.textContent.trim();
            let linkPath = '';
            if (text === 'Главная') linkPath = '/';
            if (text === 'Настройки') linkPath = '/settings/';
            if (currentPath === linkPath) {
                link.classList.add('active');
            }
        });
    });
</script>
