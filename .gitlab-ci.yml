image: python:3.13.3-alpine3.20

before_script:
  - python3 -m venv .venv 
  - . .venv/bin/activate
  - pip install -r requirements-dev.txt

stages:
  - style

pylint:
  stage: style
  script:
    - FILES=$(find . -name "*.py")
    - pylint --fail-under=6 --ignore=docs $FILES
    - echo "Pylint complete."
  artifacts:
    when: on_success
    expire_in: 30 days

pycodestyle:
  stage: style
  script:
    - FILES=$(find . -name "*.py")
    - pycodestyle --max-line-length=120 $FILES
    - echo "Pycodestyle complete."
  artifacts:
    when: on_failure
    expire_in: 30 days
    