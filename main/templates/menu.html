<nav class="navbar">
    <div class="nav-container">
        <a href="#" class="site-title" id="site-title">🎓 Knowledge Exchange</a>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="#">Главная</a></li>
                <li><a href="#">Профиль</a></li>
                <li><a href="#">Вопросы</a></li>
                <li><a href="#">Спросить ИИ</a></li>
                <li><a href="#">Комментарии</a></li>
                <li><a href="#">Задать вопрос</a></li>
                <li><a href="#">⚙️</a></li>
            </ul>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const siteTitle = document.getElementById('site-title');
        siteTitle.addEventListener('click', function(event) {
            event.preventDefault();
            window.location.href = '/';
        });
        const navLinks = document.querySelectorAll('.nav-links a');
        navLinks.forEach(function(link) {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                const text = this.textContent.trim();
                let url = '';
                if (text === 'Главная') url = '/';
                if (text === 'Профиль') url = '/profile/';
                if (text === 'Вопросы') url = '/questions/';
                if (text === 'Спросить ИИ') url = '/ask_ai/';
                if (text === 'Комментарии') url = '/comments/';
                if (text === 'Задать вопрос') url = '/ask/';
                if (text === '⚙️') url = '/settings/';
                if (url) {
                    window.location.href = url;
                }
            });
        });
        const currentPath = window.location.pathname;
        navLinks.forEach(function(link) {
            const text = link.textContent.trim();
            let linkPath = '';
            if (text === 'Главная') linkPath = '/';
            if (text === 'Профиль') linkPath = '/profile/';
            if (text === 'Вопросы') linkPath = '/questions/';
            if (text === 'Спросить ИИ') linkPath = '/ask_ai/';
            if (text === 'Комментарии') linkPath = '/comments/';
            if (text === 'Задать вопрос') linkPath = '/ask/';
            if (text === '⚙️') linkPath = '/settings/';
            if (currentPath === linkPath) {
                link.classList.add('active');
            }
        });
    });
</script>
