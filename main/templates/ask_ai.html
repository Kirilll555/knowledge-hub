<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Спросить ИИ</title>
    {% include 'styles.html' %}
</head>
<body>
    {% include 'menu.html' %}
    <h1>Спросить искусственный интеллект</h1>

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Ваш вопрос:</label><br>
            <textarea name="question" rows="5" cols="60" placeholder="Введите ваш вопрос..." required></textarea>
        </p>
        <p>
            <button type="submit">Отправить вопрос</button>
        </p>
    </form>

    {% if answer %}
    <hr>
    <h2>Ответ:</h2>
    <div>
        <p>{{ answer }}</p>
    </div>
    {% endif %}

    {% if error %}
    <hr>
    <h2>Ошибка:</h2>
    <div>
        <p>{{ error }}</p>
    </div>
    {% endif %}
</body>
</html>
