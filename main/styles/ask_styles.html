<style>
.ai-layout {
    display: flex;
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1rem;
    gap: 1.5rem;
}

.ai-sidebar {
    width: 280px;
    flex-shrink: 0;
}

.ai-main {
    flex: 1;
}

.sessions-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
    position: sticky;
    top: 20px;
}

.sessions-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
}

.new-chat-btn {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 40px;
    font-weight: 600;
    cursor: pointer;
}

.sessions-list {
    max-height: 400px;
    overflow-y: auto;
}

.session-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
}

.session-item:hover {
    background: var(--item-bg);
}

.session-item.active {
    background: rgba(242, 218, 172, 0.2);
    border-left: 3px solid var(--accent);
}

.session-title {
    flex: 1;
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.session-actions {
    display: flex;
    gap: 8px;
    opacity: 0;
}

.session-item:hover .session-actions {
    opacity: 1;
}

.edit-session, .delete-session {
    cursor: pointer;
    font-size: 14px;
    padding: 2px;
}

.edit-session:hover {
    color: var(--accent);
}

.delete-session:hover {
    color: #fa5252;
}

.thinking-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
}

.thinking-dots span {
    width: 8px;
    height: 8px;
    background: var(--text-sub);
    border-radius: 50%;
    display: inline-block;
    animation: thinking 1.4s infinite ease-in-out;
}

.thinking-dots span:nth-child(1) { animation-delay: 0s; }
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes thinking {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
    30% { opacity: 1; transform: scale(1.2); }
}

.empty-sessions {
    padding: 20px;
    text-align: center;
    color: var(--text-sub);
}

@media (max-width: 768px) {
    .ai-layout {
        flex-direction: column;
    }
    .ai-sidebar {
        width: 100%;
    }
    .sessions-card {
        position: static;
    }
}
