
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #333;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 100%;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0 20px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .nav-links a:hover {
            background-color: #555;
        }

        .nav-links a.active {
            background-color: #4CAF50;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .home-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .user-info {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="{% url 'home' %}" class="active">🏠 Главная</a></li>
                <li><a href="{% url 'about' %}">📖 О нас</a></li>
                <li><a href="{% url 'profile' %}">👤 Профиль</a></li>
            </ul>
        </div>
    </nav>

    <div class="content">
        <div class="home-card">
            <h1>🏠 Добро пожаловать на главную страницу!</h1>

            {% if user.is_authenticated %}
            <div class="user-info">
                <p>Вы вошли как: <strong>{{ user.username }}</strong></p>
                {% if is_guest %}
                <p style="color: #ff9800;">👤 Вы в гостевом режиме</p>
                {% endif %}
            </div>
            {% else %}
            <div class="user-info">
                <p>Вы не авторизованы</p>
                <p><a href="{% url 'login' %}" style="color: #4CAF50;">Войти</a> или <a href="{% url 'register' %}" style="color: #4CAF50;">зарегистрироваться</a></p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
"""
