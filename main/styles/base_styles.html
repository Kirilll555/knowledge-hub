<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(to bottom left, #527AF2, #3A4E8C, #8DAEF2);
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* остальные стили без изменений */
    .navbar {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        padding: 1rem 0;
        box-shadow: 0 6px 40px rgba(0, 0, 0, 0.3);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        width: 100%;
    }

    .nav-container {
        width: 100%;
        padding: 0 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .site-title {
        color: white;
        text-decoration: none;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.3px;
        white-space: nowrap;
        text-shadow: 0 4px 12px rgba(0,0,0,0.4);
    }

    .search-container {
        display: flex;
        align-items: center;
        width: 320px;
    }

    .search-input {
        width: 100%;
        padding: 10px 18px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 30px 0 0 30px;
        font-size: 1rem;
        outline: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        backdrop-filter: blur(5px);
    }

    .search-input::placeholder {
        color: rgba(255, 255, 255, 0.9);
    }

    .search-input:focus {
        border-color: white;
        background: rgba(255, 255, 255, 0.25);
    }

    .search-btn {
        background: rgba(255, 255, 255, 0.25);
        color: white;
        border: 1px solid rgba(255,255,255,0.35);
        padding: 10px 18px;
        border-radius: 0 30px 30px 0;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
        line-height: 1;
        transition: all 0.2s;
        backdrop-filter: blur(5px);
    }

    .search-btn:hover {
        background: rgba(255, 255, 255, 0.35);
        border-color: white;
    }

    .nav-right {
        display: flex;
        align-items: center;
    }

    .nav-links {
        display: flex;
        gap: 25px;
        list-style: none;
        align-items: center;
        flex-wrap: wrap;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: 600;
        padding: 0.7rem 1.5rem;
        border-radius: 40px;
        transition: all 0.2s;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .nav-links a:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.45);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .nav-links a.active {
        background: rgba(255, 255, 255, 0.35);
        color: white;
        font-weight: 600;
        border-color: white;
    }

    .theme-btn-nav {
        color: #F2DAAC;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 40px;
        font-size: 1.3rem;
        font-weight: 600;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        cursor: pointer;
        font-family: inherit;
        aspect-ratio: 1/1;
        min-width: 50px;
        margin-left: 15px;
    }

    .theme-btn-nav:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
        border-color: rgba(242, 218, 172, 0.5);
        box-shadow: 0 8px 20px rgba(242, 218, 172, 0.25);
        color: #F2DAAC;
    }

    @media (max-width: 768px) {
        .nav-container {
            flex-direction: column;
            gap: 15px;
        }

        .nav-links {
            justify-content: center;
            gap: 15px;
        }

        .nav-links a {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
        }

        .search-container {
            width: 100%;
            max-width: 100%;
            margin: 10px 0;
        }

        .theme-btn-nav {
            margin-left: 0;
            margin-top: 10px;
        }
    }

    @media (max-width: 480px) {
        .nav-links {
            flex-direction: column;
            width: 100%;
        }

        .nav-links a {
            width: 100%;
            text-align: center;
        }

        .theme-btn-nav {
            align-self: center;
        }
    }
</style>
