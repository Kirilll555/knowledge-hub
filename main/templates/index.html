<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
    {% include 'styles.html' %}
</head>
<body>
    {% include 'menu.html' %}

    <div class="main-content">
        <div class="left-column">
            <div class="hero-section">
                <h1>Делитесь знаниями и находите ответы</h1>
                <p>Сообщество экспертов и энтузиастов. Задавайте вопросы, делитесь опытом, помогайте другим.</p>
            </div>

            <div class="action-buttons">
                <a href="#" class="action-btn ask-btn">📝 Задать вопрос</a>
                <a href="#" class="action-btn ai-btn">🤖 Спросить ИИ</a>
            </div>

            <div class="recent-questions">
                <h2>Последние вопросы</h2>
                <div class="questions-list">
                    <div class="question-placeholder">Скоро появится</div>
                </div>
            </div>
        </div>

        <div class="right-column">
            <div class="recent-answers">
                <h2>Самые полезные ответы</h2>
                <div class="answers-list">
                    <div class="answer-placeholder">Скоро появится</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
