<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(-45deg, #4a90e2, #63b3ed, #4299e1, #3182ce);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        display: flex;
        flex-direction: column;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .navbar {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        padding: 1rem 0;
        box-shadow: 0 4px 30px rgba(49, 130, 206, 0.2), 0 0 20px rgba(255, 255, 255, 0.6);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
    }

    .nav-container {
        width: 100%;
        padding: 0 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .site-title {
        color: #ffffff;
        text-decoration: none;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: -0.3px;
        white-space: nowrap;
        opacity: 0.95;
    }

    .search-container {
        display: flex;
        align-items: center;
        width: 300px;
    }

    .search-input {
        width: 100%;
        padding: 8px 15px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 20px 0 0 20px;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s;
        background: rgba(255,255,255,0.15);
        color: #ffffff;
        backdrop-filter: blur(5px);
    }

    .search-input::placeholder {
        color: rgba(255,255,255,0.7);
    }

    .search-input:focus {
        border-color: rgba(255,255,255,0.6);
        background: rgba(255,255,255,0.2);
    }

    .search-btn {
        background: rgba(255,255,255,0.2);
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.3);
        padding: 8px 15px;
        border-radius: 0 20px 20px 0;
        cursor: pointer;
        font-size: 1rem;
        text-decoration: none;
        display: inline-block;
        line-height: 1;
        transition: all 0.2s;
        backdrop-filter: blur(5px);
    }

    .search-btn:hover {
        background: rgba(255,255,255,0.3);
        border-color: rgba(255,255,255,0.4);
    }

    .nav-right {
        display: flex;
        align-items: center;
    }

    .nav-links {
        display: flex;
        gap: 20px;
        list-style: none;
        align-items: center;
        flex-wrap: wrap;
    }

    .nav-links a {
        color: #ffffff;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        padding: 0.6rem 1.2rem;
        border-radius: 30px;
        transition: all 0.2s;
        white-space: nowrap;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255,255,255,0.2);
    }

    .nav-links a:hover {
        background: rgba(255,255,255,0.25);
        color: #ffffff;
        transform: translateY(-2px);
        border-color: rgba(255,255,255,0.3);
    }

    .nav-links a.active {
        background: rgba(255,255,255,0.3);
        color: #ffffff;
        font-weight: 600;
        border-color: rgba(255,255,255,0.4);
    }

    .main-content {
        display: flex;
        gap: 40px;
        margin: 40px 5%;
        flex: 1;
        min-height: 0;
    }

    .left-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        gap: 30px;
        min-height: 0;
    }

    .right-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-width: 500px;
        width: 500px;
    }

    .hero-section {
        text-align: left;
    }

    .hero-section h1 {
        font-size: 2.5rem;
        color: #ffffff;
        margin-bottom: 15px;
        font-weight: 700;
        letter-spacing: -0.5px;
        opacity: 0.95;
    }

    .hero-section p {
        font-size: 1.2rem;
        color: #ffffff;
        line-height: 1.6;
        opacity: 0.9;
    }

    .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 600px;
    }

    .action-btn {
        color: #FFFAEB;
        text-decoration: none;
        padding: 24px 50px;
        border-radius: 60px;
        font-size: 1.6rem;
        font-weight: 600;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        justify-content: center;
        letter-spacing: 0.5px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        position: relative;
        overflow: hidden;
        opacity: 0.95;
    }

    .action-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.3);
        color: #FFFAEB;
        box-shadow: 0 15px 30px rgba(49, 130, 206, 0.2);
    }

    .recent-questions, .recent-answers {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 15px 35px rgba(49, 130, 206, 0.2), 0 0 25px rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255,255,255,0.2);
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
    }

    .recent-questions h2 {
        color: #FFFAEB;
        font-size: 1.4rem;
        margin-bottom: 20px;
        flex-shrink: 0;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        opacity: 0.95;
    }

    .recent-answers h2 {
        color: #FFFAEB;
        font-size: 1.4rem;
        margin-bottom: 20px;
        flex-shrink: 0;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        opacity: 0.95;
    }

    .questions-list, .answers-list {
        flex: 1;
        min-height: 0;
    }

    .question-placeholder, .answer-placeholder {
        color: rgba(255,255,255,0.7);
        text-align: center;
        padding: 40px;
        background: rgba(255,255,255,0.05);
        border-radius: 12px;
        border: 2px dashed rgba(255,255,255,0.2);
        font-size: 1.1rem;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
    }

    .profile-content, .settings-content, .questions-content, .ask-content, .comments-content {
        margin: 40px 5%;
        padding: 30px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(49, 130, 206, 0.2), 0 0 25px rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255,255,255,0.2);
    }

    .profile-content h1, .settings-content h1, .questions-content h1, .ask-content h1, .comments-content h1 {
        color: #ffffff;
        margin-bottom: 20px;
        font-size: 2rem;
        font-weight: 500;
        opacity: 0.95;
    }

    @media (max-width: 768px) {
        .main-content {
            flex-direction: column;
        }

        .right-column {
            max-width: 100%;
            width: 100%;
        }

        .nav-container {
            flex-direction: column;
            gap: 15px;
        }

        .nav-links {
            justify-content: center;
        }

        .search-container {
            width: 100%;
            max-width: 100%;
            margin: 10px 0;
        }

        .hero-section h1 {
            font-size: 2rem;
        }

        .hero-section p {
            font-size: 1rem;
        }

        .action-buttons {
            max-width: 100%;
        }

        .action-btn {
            padding: 20px 40px;
            font-size: 1.4rem;
        }
    }

    @media (max-width: 480px) {
        .nav-links {
            flex-direction: column;
            width: 100%;
        }

        .nav-links a {
            width: 100%;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 1.5rem;
        }

        .action-btn {
            padding: 16px 30px;
            font-size: 1.2rem;
        }

        .recent-questions h2, .recent-answers h2 {
            font-size: 1.2rem;
        }

        .question-placeholder, .answer-placeholder {
            padding: 30px;
            font-size: 1rem;
        }
    }
</style>
