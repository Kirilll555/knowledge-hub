<nav class="navbar">
    <div class="nav-container">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/" class="site-title" id="site-title">🎓 Knowledge Hub</a>

            <div class="search-container">
                <form method="GET" action="/search/" style="display: flex; width: 100%;">
                    <input type="text" name="q" class="search-input" placeholder="Задать вопрос..." value="{{ request.GET.q }}">
                    <button type="submit" class="search-btn">📝</button>
                </form>
            </div>
        </div>

        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="#" class="nav-link">Главная</a></li>
                <li><a href="#" class="nav-link">Настройки</a></li>
            </ul>
            <button class="theme-btn-nav" id="themeToggle">🌙</button>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(function(link) {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                const text = this.textContent.trim();
                let url = '';
                if (text === 'Главная') url = '/';
                if (text === 'Настройки') url = '/settings/';
                if (url) {
                    window.location.href = url;
                }
            });
        });

        const siteTitle = document.getElementById('site-title');
        siteTitle.addEventListener('click', function(event) {
            event.preventDefault();
            window.location.href = '/';
        });

        const savedTheme = localStorage.getItem('theme');
        const themeBtn = document.getElementById('themeToggle');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeBtn.textContent = '☀️';
        }

        themeBtn.addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeBtn.textContent = isDark ? '☀️' : '🌙';
        });
    });
</script>
