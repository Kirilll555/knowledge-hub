<style>
:root {
    --accent: #F2DAAC;
    --accent-dark: #e5c98d;
    --radius-xl: 16px;
    --radius-lg: 12px;
    --radius-md: 8px;

    --bg-main: #d1d5db;
    --card-bg: #ffffff;
    --item-bg: #f3f4f6;
    --item-hover: #ffffff;
    --text-main: #111827;
    --text-sub: #4b5563;
    --border: rgba(0, 0, 0, 0.15);
    --btn-bg: #ffffff;
    --shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
}

body.dark-theme {
    --bg-main: #000000;
    --card-bg: #1a1a1a;
    --btn-bg: #1a1a1a;
    --item-bg: rgba(0, 0, 0, 0.3);
    --item-hover: rgba(242, 218, 172, 0.08);
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --border: rgba(242, 218, 172, 0.3);
    --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

html { scrollbar-gutter: stable; }

body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
}

body.dark-theme {
    background-image: none !important;
    background-color: #000000 !important;
}

*::-webkit-scrollbar { width: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--accent-dark); border-radius: 10px; }

.main-content {
    display: flex;
    gap: 30px;
    margin: 40px 5%;
    height: calc(100vh - 160px);
    min-height: 650px;
}

.left-column { flex: 1.3; display: flex; flex-direction: column; gap: 25px; }
.right-column { flex: 0.7; max-width: 500px; display: flex; flex-direction: column; }

.hero-section h1 { font-size: 2.8rem; font-weight: 850; margin-bottom: 12px; letter-spacing: -1px; }
.hero-section p { font-size: 1.3rem; color: var(--text-sub); line-height: 1.4; font-weight: 500; }

.action-buttons { display: flex; gap: 15px; }
.action-btn {
    flex: 1;
    text-decoration: none;
    color: var(--text-main) !important;
    padding: 18px;
    border-radius: var(--radius-lg);
    font-size: 1.2rem;
    font-weight: 800;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.action-btn:hover { background: var(--accent); color: #000 !important; transform: translateY(-3px); }

.recent-questions, .recent-answers {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    padding: 25px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    box-shadow: var(--shadow);
}

.header-with-icon {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    border-bottom: 3px solid var(--accent);
    padding-bottom: 10px;
    margin-bottom: 0;
}

.header-with-icon h2 {
    color: var(--accent-dark);
    font-size: 1.3rem;
    font-weight: 900;
    text-transform: uppercase;
    margin: 0;
}

.calendar-icon {
    font-size: 2.6rem;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-65%);
}

.questions-list, .answers-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 5px;
    padding-top: 25px;
}

.question-item, .answer-item {
    background: var(--item-bg);
    padding: 16px 20px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    transition: all 0.2s ease-out;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
}

.question-item:hover, .answer-item:hover {
    background: var(--item-hover);
    border-color: var(--accent);
    transform: scale(1.002);
}

.question-icon, .avatar {
    font-size: 1.4rem;
    min-width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(128, 128, 128, 0.1);
    border-radius: 8px;
}

@media (max-width: 1024px) {
    .main-content { flex-direction: column; height: auto; }
}
</style>
