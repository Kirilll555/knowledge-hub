<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(to bottom left, #527AF2, #3A4E8C, #8DAEF2);
        display: flex;
        flex-direction: column;
    }

    .navbar {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        padding: 1rem 0;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        width: 100%;
    }

    .nav-container {
        width: 100%;
        padding: 0 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .site-title {
        color: white;
        text-decoration: none;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.3px;
        white-space: nowrap;
        text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .search-container {
        display: flex;
        align-items: center;
        width: 300px;
    }

    .search-input {
        width: 100%;
        padding: 8px 15px;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 20px 0 0 20px;
        font-size: 0.95rem;
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        backdrop-filter: blur(5px);
    }

    .search-input::placeholder {
        color: rgba(255, 255, 255, 0.8);
    }

    .search-input:focus {
        border-color: white;
        background: rgba(255, 255, 255, 0.2);
    }

    .search-btn {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255,255,255,0.25);
        padding: 8px 15px;
        border-radius: 0 20px 20px 0;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
        line-height: 1;
        transition: all 0.2s;
        backdrop-filter: blur(5px);
    }

    .search-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: white;
    }

    .nav-right {
        display: flex;
        align-items: center;
    }

    .nav-links {
        display: flex;
        gap: 20px;
        list-style: none;
        align-items: center;
        flex-wrap: wrap;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        padding: 0.6rem 1.2rem;
        border-radius: 30px;
        transition: all 0.2s;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .nav-links a:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.35);
    }

    .nav-links a.active {
        background: rgba(255, 255, 255, 0.3);
        color: white;
        font-weight: 600;
        border-color: white;
    }

    .main-content {
        display: flex;
        gap: 40px;
        margin: 40px 5%;
        flex: 1;
        min-height: 0;
    }

    .left-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        gap: 30px;
        min-height: 0;
    }

    .right-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-width: 500px;
        width: 500px;
    }

    .hero-section {
        text-align: left;
    }

    .hero-section h1 {
        font-size: 2.5rem;
        color: white;
        margin-bottom: 15px;
        font-weight: 700;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .hero-section p {
        font-size: 1.2rem;
        color: white;
        line-height: 1.6;
        text-shadow: 0 1px 6px rgba(0,0,0,0.25);
    }

    .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-width: 600px;
    }

    .action-btn {
        color: #F2DAAC;
        text-decoration: none;
        padding: 20px 40px;
        border-radius: 50px;
        font-size: 1.4rem;
        font-weight: 600;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        justify-content: center;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .action-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-3px);
        border-color: white;
        box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        color: #F2DAAC;
    }

    .recent-questions {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
    }

    .recent-questions h2 {
        color: #F2DAAC;
        font-size: 1.4rem;
        margin-bottom: 20px;
        flex-shrink: 0;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 6px rgba(0,0,0,0.25);
    }

    .recent-answers {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
    }

    .recent-answers h2 {
        color: #F2DAAC;
        font-size: 1.4rem;
        margin-bottom: 20px;
        flex-shrink: 0;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 6px rgba(0,0,0,0.25);
    }

    .questions-list, .answers-list {
        flex: 1;
        min-height: 0;
    }

    .question-placeholder, .answer-placeholder {
        color: white;
        text-align: left;
        padding: 15px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        font-size: 1.1rem;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 15px;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .answer-item {
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        color: white;
        font-size: 1rem;
        border-left: 3px solid #F2DAAC;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-left-width: 3px;
        border-left-color: #F2DAAC;
    }

    .pravnaya-nastroyka {
        margin-top: 20px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(5px);
        border-radius: 12px;
        color: #F2DAAC;
        font-size: 1.2rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.15);
        letter-spacing: 0.5px;
        font-weight: 500;
        text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }

    .profile-content, .settings-content, .questions-content, .ask-content, .comments-content {
        margin: 40px 5%;
        padding: 30px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .profile-content h1, .settings-content h1, .questions-content h1, .ask-content h1, .comments-content h1 {
        color: white;
        margin-bottom: 20px;
        font-size: 2rem;
        font-weight: 600;
        text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    @media (max-width: 768px) {
        .main-content {
            flex-direction: column;
        }

        .right-column {
            max-width: 100%;
            width: 100%;
        }

        .nav-container {
            flex-direction: column;
            gap: 15px;
        }

        .nav-links {
            justify-content: center;
        }

        .search-container {
            width: 100%;
            max-width: 100%;
            margin: 10px 0;
        }

        .hero-section h1 {
            font-size: 2rem;
        }

        .hero-section p {
            font-size: 1rem;
        }

        .action-buttons {
            max-width: 100%;
        }

        .action-btn {
            padding: 16px 30px;
            font-size: 1.2rem;
        }
    }

    @media (max-width: 480px) {
        .nav-links {
            flex-direction: column;
            width: 100%;
        }

        .nav-links a {
            width: 100%;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 1.5rem;
        }

        .action-btn {
            padding: 14px 25px;
            font-size: 1.1rem;
        }

        .recent-questions h2, .recent-answers h2 {
            font-size: 1.2rem;
        }

        .answer-item {
            padding: 10px;
            font-size: 0.95rem;
        }
    }
</style>
