<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Спросить ИИ</title>
    {% include 'styles.html' %}
</head>
<body>
    {% include 'menu.html' %}
    <h1>Задать новый вопрос искусственному интеллекту</h1>

    <form method="post">
        {% csrf_token %}

        <p>
            <label>Заголовок:</label><br>
            <input type="text" name="title" size="80" required>
        </p>

        <p>
            <label>Описание:</label><br>
            <textarea name="description" rows="10" cols="80" required></textarea>
        </p>
        <p>
            <button type="submit">Задать вопрос</button>
        </p>
    </form>
</body>
</html>
