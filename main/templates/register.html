<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    {% include 'base_styles.html' %}
    {% include 'register_styles.html' %}
</head>
<body>
    {% include 'menu.html' %}

    <div class="auth-container">
        <h1>📝 Регистрация</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Имя пользователя *</label>
                <input type="text" name="username" class="form-input" required value="{{ username|default:'' }}">
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" value="{{ email|default:'' }}">
            </div>

            <div class="form-group">
                <label class="form-label">Пароль *</label>
                <input type="password" name="password" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label">Повторите пароль *</label>
                <input type="password" name="password2" class="form-input" required>
            </div>

            <button type="submit" class="submit-btn">Зарегистрироваться</button>
        </form>

        <div class="link">
            <a href="/login/">Уже есть аккаунт? Войдите</a>
        </div>
    </div>
</body>
</html>
