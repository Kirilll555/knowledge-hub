<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задать вопрос</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #eef2f6;
            width: 100%;
        }

        .nav-container {
            width: 100%;
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-title {
            color: #1a1e2b;
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #0066cc, #0052a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .nav-right {
            display: flex;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #4a5568;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.6rem 1rem;
            border-radius: 30px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-links a:hover {
            background-color: #f0f7ff;
            color: #0066cc;
        }

        .nav-links a.active {
            background-color: #e6f0ff;
            color: #0066cc;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {% include 'menu.html' %}
    <h1>Здесь будет страница для создания вопроса</h1>
</body>
</html>
