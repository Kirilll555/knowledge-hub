<nav class="navbar">
    <div class="nav-container">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/" class="site-title" id="site-title">🎓 Knowledge Hub</a>

            <div class="search-container">
                <form method="GET" action="/search/" style="display: flex; width: 100%;">
                    <input type="text" name="q" class="search-input" placeholder="Найти..." value="{{ request.GET.q }}">
                    <button type="submit" class="search-btn">📝</button>
                </form>
            </div>
        </div>

        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Главная</a></li>

                {% if user.is_authenticated %}
                    <!-- <li><a href="/profile/{{ user.username }}/" class="nav-link">👤 {{ user.username }}</a></li> -->
                    <!-- <li><a href="/settings/{{ user.username }}/" class="nav-link">👤 Настройки аккаунта {{ user.username }}</a></li> -->
                    <li><a href="/settings/" class="nav-link">Аккаунт: {{ user.username }}</a></li>
                    <li><a href="/logout/" class="nav-link">Выйти</a></li>
                {% else %}
                    <li><a href="/login/" class="nav-link">Войти</a></li>
                    <li><a href="/register/" class="nav-link">Регистрация</a></li>
                {% endif %}
            </ul>
            <button class="theme-btn-nav" id="themeToggle">🌙</button>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('theme');
        const themeBtn = document.getElementById('themeToggle');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeBtn.textContent = '☀️';
        }

        themeBtn.addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeBtn.textContent = isDark ? '☀️' : '🌙';
        });
    });
</script>
