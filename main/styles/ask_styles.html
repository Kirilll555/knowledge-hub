<style>
.ask-container {
    width: 70%;
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
}

.ask-header {
    margin-bottom: 30px;
}

.ask-header h1 {
    color: white;
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 3px 8px rgba(0,0,0,0.4);
    border-bottom: 2px solid rgba(255, 255, 255, 0.4);
    padding-bottom: 12px;
}

.ask-form {
    background: linear-gradient(145deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.1));
    background-size: 300% 300%;
    animation: softGlow 10s ease infinite;
    backdrop-filter: blur(12px);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 12px 25px rgba(0,0,0,0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    width: 100%;
}

@keyframes softGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.form-group {
    margin-bottom: 25px;
}

.form-label {
    display: block;
    color: #F2DAAC;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 10px;
}

.form-input {
    width: 100%;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 16px;
    color: white;
    font-size: 1rem;
    outline: none;
    transition: all 0.2s ease;
    font-family: inherit;
}

.form-input:focus {
    border-color: rgba(242, 218, 172, 0.6);
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 12px rgba(242, 218, 172, 0.2);
}

.form-input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

.form-textarea {
    width: 100%;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 16px;
    color: white;
    font-size: 1rem;
    outline: none;
    transition: all 0.2s ease;
    font-family: inherit;
    resize: vertical;
    min-height: 150px;
}

.form-textarea:focus {
    border-color: rgba(242, 218, 172, 0.6);
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 12px rgba(242, 218, 172, 0.2);
}

.form-textarea::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

.submit-btn {
    color: #F2DAAC;
    text-decoration: none;
    padding: 16px 35px;
    border-radius: 50px;
    font-size: 1.3rem;
    font-weight: 600;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    text-shadow: 0 3px 8px rgba(0,0,0,0.4);
    cursor: pointer;
    font-family: inherit;
    margin-top: 10px;
}

.submit-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-3px);
    border-color: white;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    color: #F2DAAC;
}

body.dark-theme .ask-form {
    background: linear-gradient(145deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.3));
    border-color: rgba(255, 255, 255, 0.2);
}

body.dark-theme .form-input,
body.dark-theme .form-textarea {
    background: rgba(0, 0, 0, 0.25);
    border-color: rgba(255, 255, 255, 0.2);
}

body.dark-theme .submit-btn {
    background: rgba(0, 0, 0, 0.3);
    border-color: rgba(255, 255, 255, 0.2);
}

body.dark-theme .submit-btn:hover {
    background: rgba(0, 0, 0, 0.4);
}

@media screen and (max-width: 768px) {
    .ask-container {
        width: 90%;
        margin: 20px auto;
    }

    .ask-header h1 {
        font-size: 1.8rem;
    }

    .ask-form {
        padding: 25px;
    }

    .submit-btn {
        width: 100%;
        justify-content: center;
    }
}

@media screen and (max-width: 480px) {
    .ask-container {
        width: 95%;
        padding: 0 10px;
    }

    .ask-header h1 {
        font-size: 1.5rem;
    }

    .ask-form {
        padding: 20px;
    }

    .form-label {
        font-size: 1rem;
    }

    .form-input,
    .form-textarea {
        padding: 12px 16px;
    }

    .submit-btn {
        padding: 14px 28px;
        font-size: 1.2rem;
    }
}
</style>
